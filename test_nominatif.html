<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Nominatif Section 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Test Section 2 - Kode Anggaran</h1>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-semibold mb-4">Format Baru: LayananUmum.KodeLayanan1.KodeLayanan2</h2>

            <div id="loading" class="text-gray-500">
                Memuat data dari API...
            </div>

            <div id="results" class="hidden">
                <h3 class="font-medium mb-3">Contoh Data yang Diambil:</h3>
                <div id="data-list" class="space-y-2"></div>

                <h3 class="font-medium mt-6 mb-3">Format yang Dihasilkan:</h3>
                <div id="format-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('http://localhost/api/rka-details');
                const data = await response.json();

                // Filter untuk data perjalanan dinas
                const perjalananData = data.filter(item =>
                    item.layanan.toLowerCase().includes('perjalanan') ||
                    item.layanan.toLowerCase().includes('dinas') ||
                    item.artiKode.toLowerCase().includes('perjalanan') ||
                    item.artiKode.toLowerCase().includes('dinas') ||
                    item.artiKode.toLowerCase().includes('meeting') ||
                    item.artiKode.toLowerCase().includes('transport') ||
                    item.artiKode.toLowerCase().includes('penginapan') ||
                    item.artiKode.toLowerCase().includes('uang harian')
                );

                // Ambil 5 contoh pertama
                const samples = perjalananData.slice(0, 5);

                // Tampilkan data asli
                const dataList = document.getElementById('data-list');
                samples.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-gray-50 rounded border';
                    div.innerHTML = `
                        <strong>Contoh ${index + 1}:</strong><br>
                        Layanan Umum: ${item.layananUmum}<br>
                        Kode Layanan 1: ${item.kodeLayanan1}<br>
                        Kode Layanan 2: ${item.kodeLayanan2}<br>
                        Layanan Tata Usaha: ${item.layananTataUsaha}<br>
                        Layanan: ${item.layanan.substring(0, 80)}...
                    `;
                    dataList.appendChild(div);
                });

                // Tampilkan format baru
                const formatList = document.getElementById('format-list');
                samples.forEach((item, index) => {
                    const kodeFormat = `${item.layananUmum}.${item.kodeLayanan1}.${item.kodeLayanan2}`;
                    const kodeLengkap = `${item.layananUmum}.${item.kodeLayanan1}.${item.kodeLayanan2}.${item.layananTataUsaha}`;

                    const div = document.createElement('div');
                    div.className = 'p-3 bg-blue-50 rounded border border-blue-200';
                    div.innerHTML = `
                        <strong>Format ${index + 1}:</strong><br>
                        <span class="text-blue-700 font-mono">${kodeFormat}</span><br>
                        <span class="text-gray-600 text-sm">Lengkap: ${kodeLengkap}</span><br>
                        <span class="text-gray-600 text-sm">Layanan: ${item.artiKode}</span>
                    `;
                    formatList.appendChild(div);
                });

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('results').classList.remove('hidden');

            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <div class="text-red-500">
                        <strong>Error:</strong> ${error.message}<br>
                        Pastikan backend API berjalan di http://localhost/api
                    </div>
                `;
            }
        }

        // Jalankan fetch data
        fetchData();
    </script>
</body>
</html>
