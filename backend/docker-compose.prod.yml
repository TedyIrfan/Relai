services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: production
    image: relai-backend:${IMAGE_TAG:-latest}
    container_name: relai-app-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - relai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: relai-nginx-prod
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      # SSL certificates (uncomment when ready)
      # - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - relai-network
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: relai-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Backup volume
      - postgres_backup:/backup
    networks:
      - relai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-relai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to expose PostgreSQL externally (not recommended for production)
    # ports:
    #   - "${DB_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: relai-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - relai-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Uncomment to expose Redis externally (not recommended for production)
    # ports:
    #   - "${REDIS_PORT:-6379}:6379"

  # PgAdmin - Optional for production database management
  # Remove this service in production for better security
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: relai-pgadmin-prod
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@relai.go.id}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - relai-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

  # Portainer - Docker management UI
  # Optional: Only start with --profile admin flag
  portainer:
    image: portainer/portainer-ce:latest
    container_name: relai-portainer-prod
    restart: unless-stopped
    command: --host=unix:///var/run/docker.sock
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - relai-network
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

volumes:
  postgres_data:
    driver: local
  postgres_backup:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  portainer_data:
    driver: local

networks:
  relai-network:
    driver: bridge
